<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днём Рождения!</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom, #fdf0ec, #aee1f9);
            overflow: hidden;
            font-family: 'Press Start 2P', cursive;
        }
        
        .container {
            display: flex;
            width: 90%;
            max-width: 1200px;
            position: relative;
        }
        
        .left-panel {
            flex: 0.7;
            padding-right: 20px;
        }
        
        .right-panel {
            flex: 1.3;
            position: relative;
        }
        
        canvas {
            border: 4px solid #aee1f9;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: block;
        }
        
        #greeting {
            height: 400px;
            overflow: hidden;
            padding: 20px;
            background: linear-gradient(135deg, #f0faff, #e8f7fe);
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s ease;
            font-size: clamp(12px, 2vw, 14px);
        }
        
        .greeting-content {
            position: relative;
            text-align: center;
            width: 100%;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .greeting-line {
            line-height: 1.6;
            color: #333;
            margin-bottom: 8px;
            text-align: center;
            width: 90%;
            transition: opacity 0.8s ease, transform 0.8s ease;
            opacity: 0;
            transform: translateY(20px);
            word-wrap: break-word;
        }
        
        .greeting-line.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .greeting-line.fading {
            opacity: 0;
            transform: translateY(-20px);
        }
        
        #startButton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Press Start 2P', cursive;
            font-size: 18px;
            padding: 15px 30px;
            background: #fdf0ec;
            border: 3px solid #aee1f9;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            z-index: 10;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.05);
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            }
        }
        
        #startButton:hover {
            background: #aee1f9;
        }
        
        #easterEgg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 5;
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.8s ease;
            pointer-events: none;
        }
        
        #easterEgg.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            
            .left-panel {
                width: 100%;
                padding-right: 0;
                margin-bottom: 20px;
            }
            
            canvas {
                width: 100%;
                max-width: 700px;
                height: auto;
            }
            
            #greeting {
                height: 300px;
                font-size: clamp(10px, 3vw, 12px);
            }
            
            .greeting-line {
                line-height: 1.5;
                margin-bottom: 6px;
            }
            
            #startButton {
                font-size: 16px;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div id="greeting">
                <div class="greeting-content"></div>
            </div>
        </div>
        <div class="right-panel">
            <div id="game-canvas"></div>
            <button id="startButton" style="display: none;">Начать игру</button>
            <div id="easterEgg"></div>
        </div>
    </div>
    
    <script>
        let bee, obstacles, flowers, greetingLines, collectedFlowers, highScore;
        let beeImg, flowerImg, cloudImg;
        let gameState = 'paused';
        const canvasWidth = 700;
        const canvasHeight = 500;
        let maxDisplayedLines = 0;
        let greetingCompleted = false;
        let greetingState = 'showing';
        let easterEggTimeoutId = null;
        let currentLineIndex = 0; // Для отслеживания текущей строки
        
        const easterEggs = {
            25: "Ого, вы собираетесь продолжить?",
            30: "Да Вы уверенно идёте к цели!",
            37: "З7 цветочков? Поздравляю! Вы стали экспертом цветочной магии \"37\" уровня!",
            40: "Хм, как далеко Вы хотите зайти?",
            50: "Полсотни! Я удивлена, мне самой ещё не удавалось добраться до этого рекорда!",
            60: "Вау..60?! Вы хотите весь день потратить на эту игру?)",
            70: "Ну всё я сдаюсь. У меня заканчиваются идеи! Дайте угадаю... Ваша цель 100?",
            80: "Ну Вы прирождённый мастер! Это мощно...мне льстит, что Вы тратите своё время на это...",
            90: "Серьёзно, Вы не устали!? Сколько нужно было попыток, чтобы добраться до этого числа? Или для Вас это слишком просто)?",
            100: "100?! Вы взяли и сделали это! Легендарный момент. Ну всё, я Вам буду должна ещё один сюрприз за поставленные рекорды!"
        };
        
        try {
            highScore = parseInt(localStorage.getItem('flappyBeeHighScore')) || 0;
        } catch (e) {
            console.error("Ошибка при загрузке рекорда:", e);
            highScore = 0;
        }
        
        function preload() {
            console.log("Starting preload...");
            try {
                beeImg = loadImage('https://raw.githubusercontent.com/cc4arin/gift/main/bee.png', 
                    () => console.log("Bee image loaded"), 
                    () => console.error("Failed to load bee.png")
                );
                flowerImg = loadImage('https://raw.githubusercontent.com/cc4arin/gift/main/flower.png', 
                    () => console.log("Flower image loaded"), 
                    () => console.error("Failed to load flower.png")
                );
                cloudImg = loadImage('https://raw.githubusercontent.com/cc4arin/gift/main/clouds.png', 
                    () => console.log("Cloud image loaded"), 
                    () => console.error("Failed to load clouds.png")
                );
            } catch (e) {
                console.error("Preload error:", e);
            }
        }

        function setup() {
            console.log("Setup started");
            let canvas = createCanvas(canvasWidth, canvasHeight);
            canvas.parent('game-canvas');
            
            bee = new Bee();
            obstacles = [];
            flowers = [];
            greetingLines = [
                "✨Михаил Сергеевич, c Днём рождения!✨",
                "Хотела поздравить Вас по-особенному",
                "и вот что получилось!",
                "Желаю Вам крепкого здоровья,",
                "счастья и чтобы каждый день приносил радость",
                "Вы вдохновляете творить и пробовать новое!",
                "И я рада, что знакома с таким замечательным человеком!",
                "Пусть в работе сопутствует успех",
                "и всё задуманное воплотится!"
            ];
            collectedFlowers = 0;
            maxDisplayedLines = 0;
            currentLineIndex = 0;
            
            for (let i = 0; i < 8; i++) {
                obstacles.push(new Obstacle());
            }
            for (let i = 0; i < 5; i++) {
                flowers.push(new Flower());
            }
            
            updateGreeting();
            
            let startButton = document.getElementById('startButton');
            startButton.style.display = 'block';
            startButton.onclick = () => {
                gameState = 'playing';
                startButton.style.display = 'none';
                bee = new Bee();
            };
            
            console.log("Setup completed");
        }

        function draw() {
            console.log("Draw called, gameState:", gameState);
            background('#ccfbff');
            
            if (gameState === 'paused') {
                return;
            }
            
            bee.update();
            bee.show();
            
            textAlign(LEFT, TOP);
            textFont('Press Start 2P');
            textSize(16);
            fill(51);
            text(`Цветки: ${collectedFlowers}`, 10, 10);
            textAlign(RIGHT, TOP);
            text(`Рекорд: ${highScore}`, width - 10, 10);
            
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                obstacles[i].show();
                
                if (obstacles[i].hits(bee)) {
                    gameState = 'paused';
                    document.getElementById('startButton').style.display = 'block';
                    
                    if (collectedFlowers > highScore) {
                        highScore = collectedFlowers;
                        try {
                            localStorage.setItem('flappyBeeHighScore', highScore.toString());
                        } catch (e) {
                            console.error("Ошибка при сохранении рекорда:", e);
                        }
                    }
                    
                    collectedFlowers = 0;
                    
                    obstacles = [];
                    flowers = [];
                    for (let j = 0; j < 8; j++) {
                        obstacles.push(new Obstacle());
                    }
                    for (let j = 0; j < 5; j++) {
                        flowers.push(new Flower());
                    }
                }
                
                if (obstacles[i].offscreen()) {
                    obstacles.splice(i, 1);
                    obstacles.push(new Obstacle());
                }
            }
            
            for (let i = flowers.length - 1; i >= 0; i--) {
                flowers[i].update();
                flowers[i].show();
                
                if (flowers[i].hits(bee)) {
                    collectedFlowers++;
                    
                    if (easterEggs[collectedFlowers]) {
                        showEasterEgg(easterEggs[collectedFlowers]);
                    }
                    
                    if (greetingState === 'showing' && 
                        collectedFlowers > maxDisplayedLines && 
                        collectedFlowers <= greetingLines.length) {
                        maxDisplayedLines = collectedFlowers;
                        updateGreeting();
                        
                        if (maxDisplayedLines >= greetingLines.length && !greetingCompleted) {
                            greetingCompleted = true;
                            setTimeout(() => {
                                let greeting = document.getElementById('greeting');
                                greeting.style.opacity = '0';
                                setTimeout(() => {
                                    greetingState = 'hidden';
                                    let greetingContent = document.querySelector('.greeting-content');
                                    greetingContent.innerHTML = '';
                                    greeting.style.opacity = '1';
                                }, 1500);
                            }, 5000);
                        }
                    }
                    
                    flowers.splice(i, 1);
                    flowers.push(new Flower());
                }
                
                if (flowers[i].offscreen()) {
                    flowers.splice(i, 1);
                    flowers.push(new Flower());
                }
            }
        }

        function updateGreeting() {
            console.log("Updating greeting, maxDisplayedLines:", maxDisplayedLines);
            let greetingContent = document.querySelector('.greeting-content');
            
            // Очищаем содержимое
            greetingContent.innerHTML = '';
            
            // Создаем контейнер для центрирования
            let centeringContainer = document.createElement('div');
            centeringContainer.style.display = 'flex';
            centeringContainer.style.flexDirection = 'column';
            centeringContainer.style.justifyContent = 'center';
            centeringContainer.style.alignItems = 'center';
            centeringContainer.style.height = '100%';
            centeringContainer.style.width = '100%';
            
            greetingContent.appendChild(centeringContainer);
            
            // Показываем только одну строку за раз
            if (currentLineIndex < maxDisplayedLines) {
                let lineElement = document.createElement('div');
                lineElement.className = 'greeting-line';
                lineElement.textContent = greetingLines[currentLineIndex];
                
                centeringContainer.appendChild(lineElement);
                
                // Показываем строку с анимацией
                setTimeout(() => {
                    lineElement.classList.add('visible');
                }, 100);
                
                // Запускаем исчезновение через 2 секунды
                setTimeout(() => {
                    lineElement.classList.remove('visible');
                    lineElement.classList.add('fading');
                    
                    // После завершения анимации исчезновения переходим к следующей строке
                    setTimeout(() => {
                        currentLineIndex++;
                        if (currentLineIndex < greetingLines.length) {
                            updateGreeting();
                        }
                    }, 800); // Длительность анимации исчезновения
                }, 2000); // Время отображения строки
            }
        }

        function showEasterEgg(message) {
            console.log("Showing easter egg:", message);
            if (greetingState === 'hidden') {
                let greetingContent = document.querySelector('.greeting-content');
                
                greetingContent.innerHTML = '';
                
                let easterEggLine = document.createElement('div');
                easterEggLine.className = 'greeting-line';
                easterEggLine.textContent = message;
                
                greetingContent.appendChild(easterEggLine);
                setTimeout(() => {
                    easterEggLine.classList.add('visible');
                }, 100);
                
                if (easterEggTimeoutId) {
                    clearTimeout(easterEggTimeoutId);
                }
                
                easterEggTimeoutId = setTimeout(() => {
                    easterEggLine.classList.remove('visible');
                    easterEggLine.classList.add('fading');
                    
                    setTimeout(() => {
                        if (greetingContent.contains(easterEggLine)) {
                            greetingContent.removeChild(easterEggLine);
                        }
                    }, 1000);
                }, 5000);
            } else {
                const easterEggElement = document.getElementById('easterEgg');
                
                if (easterEggTimeoutId) {
                    clearTimeout(easterEggTimeoutId);
                }
                
                easterEggElement.textContent = message;
                easterEggElement.classList.add('visible');
                
                easterEggTimeoutId = setTimeout(() => {
                    easterEggElement.classList.remove('visible');
                }, 5000);
            }
        }

        function keyPressed() {
            console.log("Key pressed:", key, "gameState:", gameState);
            if (key === ' ' && gameState === 'paused') {
                gameState = 'playing';
                document.getElementById('startButton').style.display = 'none';
                bee = new Bee();
            } else if (key === ' ' && gameState === 'playing') {
                bee.flap();
            }
        }

        class Bee {
            constructor() {
                this.x = 150;
                this.y = height / 2;
                this.velocity = 0;
                this.gravity = 0.4;
                this.lift = -10;
                this.size = 55;
                this.damping = 0.95;
                this.hitbox = this.size * 0.6;
            }
            
            update() {
                if (gameState === 'paused') return;
                this.velocity += this.gravity;
                this.velocity *= this.damping;
                this.y += this.velocity;
                this.y = constrain(this.y, 0, height - this.size/2);
            }
            
            show() {
                push();
                translate(this.x, this.y);
                let angle = sin(frameCount * 0.1) * 5;
                rotate(radians(angle));
                
                if (beeImg && beeImg.width > 0) {
                    image(beeImg, -this.size/2, -this.size/2, this.size, this.size);
                } else {
                    console.warn("Bee image not loaded, using fallback");
                    fill('#FFC107');
                    stroke('#000');
                    strokeWeight(2);
                    ellipse(0, 0, this.size, this.size * 0.7);
                    fill('#000');
                    noStroke();
                    rect(-10, -this.size*0.35, 5, this.size*0.7);
                    rect(0, -this.size*0.35, 5, this.size*0.7);
                    rect(10, -this.size*0.35, 5, this.size*0.7);
                    fill(255, 255, 255, 200);
                    stroke(200);
                    strokeWeight(1);
                    let wingAngle = sin(frameCount * 0.2) * 15;
                    push();
                    rotate(radians(wingAngle));
                    ellipse(-15, -10, 20, 10);
                    pop();
                    push();
                    rotate(radians(-wingAngle));
                    ellipse(15, -10, 20, 10);
                    pop();
                }
                pop();
            }
            
            flap() {
                this.velocity = this.lift;
            }
        }

        class Obstacle {
            constructor() {
                this.x = width + random(100, 300);
                this.gap = random(220, 320);
                this.top = random(height / 6, height - this.gap - height / 6);
                this.w = random(80, 120);
                this.speed = random(4, 6);
                this.hitboxPadding = 10;
            }
            
            update() {
                if (gameState === 'paused') return;
                this.x -= this.speed;
            }
            
            show() {
                if (cloudImg && cloudImg.width > 0) {
                    image(cloudImg, this.x, 0, this.w, this.top);
                    image(cloudImg, this.x, this.top + this.gap, this.w, height - this.top - this.gap);
                } else {
                    console.warn("Cloud image not loaded, using fallback");
                    noStroke();
                    fill('#aee1f9');
                    rect(this.x, 0, this.w, this.top, 20);
                    rect(this.x, this.top + this.gap, this.w, height - this.top - this.gap, 20);
                    fill(255, 255, 255, 100);
                    ellipse(this.x + this.w/2, this.top, 60, 30);
                    ellipse(this.x + this.w/2, this.top + this.gap, 60, 30);
                }
            }
            
            hits(bee) {
                if (bee.x + bee.hitbox/2 > this.x + this.hitboxPadding && 
                    bee.x - bee.hitbox/2 < this.x + this.w - this.hitboxPadding) {
                    if (bee.y - bee.hitbox/2 < this.top - this.hitboxPadding || 
                        bee.y + bee.hitbox/2 > this.top + this.gap + this.hitboxPadding) {
                        return true;
                    }
                }
                return false;
            }
            
            offscreen() {
                return this.x < -this.w;
            }
        }

        class Flower {
            constructor() {
                this.x = width + random(100, 300);
                this.y = random([height / 6, height / 3, height / 2, 2 * height / 3, 5 * height / 6]);
                this.size = 45;
                this.speed = random(2, 4);
                this.hitbox = this.size * 0.8;
            }
            
            update() {
                if (gameState === 'paused') return;
                this.x -= this.speed;
            }
            
            show() {
                push();
                translate(this.x, this.y);
                let angle = sin(frameCount * 0.1) * 5;
                rotate(radians(angle));
                
                if (flowerImg && flowerImg.width > 0) {
                    image(flowerImg, -this.size/2, -this.size/2, this.size, this.size);
                } else {
                    console.warn("Flower image not loaded, using fallback");
                    fill('#FFB6C1');
                    noStroke();
                    for (let i = 0; i < 8; i++) {
                        push();
                        rotate(TWO_PI * i / 8);
                        ellipse(15, 0, 15, 10);
                        pop();
                    }
                    fill('#FFFF99');
                    ellipse(0, 0, this.size * 0.5);
                    stroke('#228B22');
                    strokeWeight(3);
                    line(0, this.size/2, 0, this.size);
                }
                pop();
            }
            
            hits(bee) {
                let d = dist(bee.x, bee.y, this.x, this.y);
                return d < (bee.hitbox + this.hitbox) / 2;
            }
            
            offscreen() {
                return this.x < -this.size;
            }
        }

        window.onload = () => {
            if (typeof p5 === 'undefined') {
                console.error("p5.js не загружен! Проверьте подключение к интернету или ссылку на библиотеку.");
            } else {
                console.log("p5.js успешно загружен.");
            }
        };
    </script>
</body>
</html>
